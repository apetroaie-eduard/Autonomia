<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Page</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="public-header">
    <div class="container">
      <div class="header-content">
        <h1>📊 Status Page</h1>
        <a href="/admin" class="btn btn-outline">Admin</a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Overall Status Banner -->
    <section class="status-banner" id="status-banner">
      <div class="status-icon">✓</div>
      <div class="status-text">
        <h2 id="overall-status">Loading...</h2>
        <p id="status-description">Checking system status</p>
      </div>
    </section>

    <!-- Services List -->
    <section class="services-section">
      <h3>Services</h3>
      <div id="services-container" class="services-list">
        <div class="loading">Loading services...</div>
      </div>
    </section>

    <!-- Recent Incidents -->
    <section class="incidents-section">
      <h3>Recent Incidents</h3>
      <div id="incidents-container" class="incidents-list">
        <div class="loading">Loading incidents...</div>
      </div>
    </section>
  </main>

  <footer class="public-footer">
    <div class="container">
      <p>Powered by Status Page Monitor</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
